name: C3U Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Normalize format
        run: gofmt -w cmd internal
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/c3u
